[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "joe-orchestrator"
version = "1.3.2"
description = "Lightweight local multi-AI CLI orchestrator"
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{name = "Felix Quinton"}]
keywords = [
    "ai",
    "antigravity",
    "claude",
    "cli",
    "codex",
    "copilot",
    "multi-agent",
    "orchestrator",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "pexpect>=4.8; sys_platform != 'win32'",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/felixquinton1/joe"
Documentation = "https://github.com/felixquinton1/joe/blob/main/docs/user-guide.md"
Repository = "https://github.com/felixquinton1/joe"
Issues = "https://github.com/felixquinton1/joe/issues"
Changelog = "https://github.com/felixquinton1/joe/blob/main/CHANGELOG.md"
Security = "https://github.com/felixquinton1/joe/security/policy"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "bandit==1.9.4",
    "pytest>=8",
    "ruff==0.15.22",
    "twine>=6",
]

[project.scripts]
joe = "joe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
joe = ["web_assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Règles nommées, pas celles par défaut : ruff 0.16 a élargi son jeu implicite
# et fait passer la CI de vert à 73 erreurs sans qu'une ligne de code change.
# Élargir le jeu reste possible, mais comme une décision, pas une mise à jour.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# `usage.py` agrège l'API des trois lecteurs de quota et réexporte leurs
# symboles sous un nom stable. Ces imports ne sont pas inutilisés : ils sont
# la surface publique du module, et les retirer casse ses appelants.
"src/joe/usage.py" = ["F401"]
