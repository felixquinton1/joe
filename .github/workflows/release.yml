name: Release packages

on:
  workflow_dispatch:
    inputs:
      target:
        description: Package index to publish to
        required: true
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      # Production is deliberate: select a tag in the workflow UI, then pypi.
      - name: Check the tag matches the packaged version
        if: inputs.target == 'pypi'
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "Production releases must run from a v* tag" >&2
            exit 1
          fi
          packaged=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_NAME" = "$tagged" ] || [ "$packaged" != "$tagged" ]; then
            echo "Tag $GITHUB_REF_NAME but pyproject declares $packaged" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  github-release:
    if: inputs.target == 'pypi'
    needs: [build, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag

  pypi:
    if: inputs.target == 'pypi'
    needs: build
    runs-on: ubuntu-latest
    # `pypi` doit exister dans Settings → Environments, et le dépôt être
    # déclaré éditeur de confiance sur PyPI. Aucun jeton n'est stocké : PyPI
    # vérifie l'identité du workflow lui-même.
    environment:
      name: pypi
      url: https://pypi.org/p/joe-orchestrator
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  testpypi:
    if: inputs.target == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/joe-orchestrator
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
