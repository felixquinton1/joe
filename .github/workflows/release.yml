name: Release packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      # La version publiée doit être celle du tag : sans ce contrôle, un tag
      # posé avant le bump publie silencieusement la version précédente.
      - name: Check the tag matches the packaged version
        run: |
          packaged=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$packaged" != "$tagged" ]; then
            echo "Tag $GITHUB_REF_NAME but pyproject declares $packaged" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag

  pypi:
    needs: build
    runs-on: ubuntu-latest
    # `pypi` doit exister dans Settings → Environments, et le dépôt être
    # déclaré éditeur de confiance sur PyPI. Aucun jeton n'est stocké : PyPI
    # vérifie l'identité du workflow lui-même.
    environment:
      name: pypi
      url: https://pypi.org/p/joe-orchestrator
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
