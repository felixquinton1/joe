name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Une analyse hebdomadaire attrape les règles publiées après un commit,
    # sur un dépôt qui peut rester des semaines sans changement.
    - cron: "17 4 * * 1"

jobs:
  analyze:
    name: Analyse · ${{ matrix.language }}
    # Le code scanning n'est gratuit que sur un dépôt public : sur un dépôt
    # privé sans GitHub Advanced Security, l'envoi des résultats échoue et la
    # vérification reste rouge. L'analyse s'active d'elle-même à la publication.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      # Lecture du run courant, sans laquelle l'action échoue.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: /language:${{ matrix.language }}
