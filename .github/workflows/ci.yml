name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live_smokes:
        description: Contact the four locally authenticated provider CLIs
        required: false
        type: boolean
        default: false

jobs:
  portable-install:
    name: Install · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - run: joe --version
      - run: joe --help
      - run: joe cli --help

  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e . pytest
      - run: pytest -q
      - run: node --check src/joe/web_assets/app_usage.js
      - run: node --check src/joe/web_assets/app_conversations.js
      - run: node --check src/joe/web_assets/app.js
      - run: node --check src/joe/web_assets/markdown.js
      - run: npm ci
        working-directory: vscode-extension
      - run: npm run check
        working-directory: vscode-extension
      - run: npm test
        working-directory: vscode-extension
      - run: joe --version
      - run: joe --dry-run -C . "Ne modifie rien, analyse seulement Joe"

  live-provider-smokes:
    if: github.event_name == 'workflow_dispatch' && inputs.live_smokes
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -e . pytest
      - run: JOE_LIVE_SMOKE=1 pytest -q tests/test_live_cli_smoke.py
