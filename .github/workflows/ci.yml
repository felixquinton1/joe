name: CI

# Moindre privilege explicite : sans ce bloc, le jeton du job herite du defaut
# du depot, qui peut autoriser l'ecriture. Aucun job de CI n'en a besoin.
permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live_smokes:
        description: Contact the four locally authenticated provider CLIs
        required: false
        type: boolean
        default: false

jobs:
  portable-install:
    name: Install · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Le plugin publie chaque test en échec comme annotation : lisible sur
      # la PR et par l'API, là où le journal brut n'indique qu'un code de sortie.
      - run: python -m pip install . pytest pytest-github-actions-annotate-failures
      - run: joe --version
      - run: joe --help
      - run: joe cli --help
      # La suite ne tournait que sur Linux : rien ne vérifiait le serveur, le
      # routage ni les quotas ailleurs, alors que ces chemins dépendent de la
      # plateforme (tmux et pexpect n'existent pas partout).
      - run: pytest -q

  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # Version épinglée : une montée de ruff ne doit pas faire échouer la CI
      # sans qu'une ligne de code ait changé.
      - run: python -m pip install -e . pytest ruff==0.15.4 bandit==1.9.4
      - run: ruff check src tests
      - run: bandit -r src/joe -ll -q
      - run: pytest -q
      # Tout script livré est vérifié : en nommer cinq sur sept laissait
      # passer une erreur de syntaxe dans les deux autres.
      - run: |
          for script in src/joe/web_assets/*.js; do
            node --check "$script"
          done
      - run: node --test tests/test_web_assets.mjs
      - run: npm ci
        working-directory: vscode-extension
      - run: npm run check
        working-directory: vscode-extension
      - run: npm test
        working-directory: vscode-extension
      - run: joe --version
      - run: joe --dry-run -C . "Ne modifie rien, analyse seulement Joe"

  live-provider-smokes:
    if: github.event_name == 'workflow_dispatch' && inputs.live_smokes
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python -m pip install -e . pytest
      - run: JOE_LIVE_SMOKE=1 pytest -q tests/test_live_cli_smoke.py
